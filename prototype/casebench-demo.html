<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Codename — Practice real work, not just theory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/alasql/4.1.1/alasql.min.js"></script>
<style>
  :root{
    --bg-app:#0E1116;
    --bg-panel:#161A21;
    --bg-panel-raised:#1B2028;
    --bg-console:#10131A;
    --bg-hover:#1F242E;
    --border:#262B35;
    --border-soft:#1D2129;
    --text-primary:#E6E9EF;
    --text-secondary:#9AA3B2;
    --text-faint:#5B6472;
    --accent:#4C8DFF;
    --accent-dark:#3873DB;
    --accent-soft:rgba(76,141,255,.14);
    --easy:#2FB170;
    --easy-soft:rgba(47,177,112,.14);
    --medium:#E0972F;
    --medium-soft:rgba(224,151,47,.14);
    --hard:#E0523F;
    --hard-soft:rgba(224,82,63,.14);
    --purple:#9C7CF4;
    --purple-soft:rgba(156,124,244,.14);
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius:6px;
    --radius-sm:4px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:var(--sans);color:var(--text-primary);background:var(--bg-app);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;}
  textarea,input,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--accent-soft);}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#2A303C;border-radius:100px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #shell{min-height:100vh;display:flex;flex-direction:column;}
  .topbar{background:var(--bg-panel);display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;flex-shrink:0;border-bottom:1px solid var(--border);}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--accent),#7FB0FF);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;color:#0E1116;}
  .brand-name{font-size:13.5px;font-weight:600;color:var(--text-primary);}
  .topbar-nav{display:flex;gap:4px;margin-left:18px;}
  .topbar-nav a{font-size:12.5px;color:var(--text-secondary);padding:6px 10px;border-radius:var(--radius-sm);font-weight:500;}
  .topbar-nav a:hover, .topbar-nav a.active{background:var(--bg-hover);color:var(--text-primary);}
  .topbar-left{display:flex;align-items:center;}
  .topbar-right{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-faint);}
  .live-chip{display:flex;align-items:center;gap:6px;font-family:var(--mono);}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--easy);box-shadow:0 0 0 3px var(--easy-soft);}

  .ledger{background:var(--bg-console);border-bottom:1px solid var(--border);padding:5px 16px;font-family:var(--mono);font-size:10.5px;color:var(--text-faint);white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ledger-label{color:#454C58;text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;flex-shrink:0;}
  .ledger-track{display:flex;gap:16px;overflow:hidden;position:relative;flex:1;}
  .ledger-item{flex-shrink:0;display:flex;gap:6px;align-items:center;opacity:0;animation:fadeIn .4s ease forwards;}
  .ledger-item .t{color:#3D4450;}
  .ledger-item .k{color:var(--accent);}
  @keyframes fadeIn{to{opacity:1;}}

  main{flex:1;display:flex;flex-direction:column;min-height:0;}

  .page{max-width:1080px;margin:0 auto;padding:36px 24px 80px;width:100%;}
  .page-header{margin-bottom:22px;}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
  .page-title{font-size:22px;font-weight:700;margin:0 0 6px;}
  .page-sub{color:var(--text-secondary);font-size:13.5px;max-width:680px;line-height:1.55;}

  .role-filter{display:flex;gap:6px;margin:16px 0 18px;flex-wrap:wrap;}
  .role-filter button{background:var(--bg-panel-raised);border:1px solid var(--border);color:var(--text-secondary);font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;}
  .role-filter button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}
  .role-filter button:hover:not(.active){background:var(--bg-hover);color:var(--text-primary);}

  .problem-table{width:100%;border-collapse:collapse;background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .problem-table thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:600;padding:10px 18px;background:var(--bg-panel-raised);border-bottom:1px solid var(--border);}
  .problem-table tbody td{padding:16px 18px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
  .problem-table tbody tr:last-child td{border-bottom:none;}
  .problem-table tbody tr{transition:background .1s ease;cursor:pointer;}
  .problem-table tbody tr:hover{background:var(--bg-hover);}
  .status-icon{width:20px;text-align:center;font-size:14px;}
  .status-icon.done{color:var(--easy);}
  .status-icon.progress{color:var(--medium);}
  .status-icon.todo{color:var(--text-faint);}
  .prob-title-cell{display:flex;flex-direction:column;gap:4px;}
  .prob-title{font-size:14px;font-weight:600;color:var(--text-primary);}
  .prob-title:hover{color:var(--accent);}
  .prob-company{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);}
  .role-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.02em;display:inline-block;background:var(--purple-soft);color:var(--purple);}
  .diff-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.02em;display:inline-block;}
  .diff-easy{background:var(--easy-soft);color:var(--easy);}
  .diff-medium{background:var(--medium-soft);color:var(--medium);}
  .diff-hard{background:var(--hard-soft);color:var(--hard);}
  .type-badge{font-size:10px;font-family:var(--mono);color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .tag-cell{display:flex;gap:5px;flex-wrap:wrap;max-width:260px;}
  .tag-pill{font-size:10.5px;background:var(--bg-panel-raised);border:1px solid var(--border);color:var(--text-secondary);padding:2px 8px;border-radius:100px;font-family:var(--mono);}
  .time-cell{font-family:var(--mono);font-size:12px;color:var(--text-secondary);white-space:nowrap;}

  .btn{border:none;border-radius:var(--radius-sm);padding:8px 15px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .12s ease, opacity .12s ease, border-color .12s ease;}
  .btn-primary{background:var(--accent);color:#0B0E12;}
  .btn-primary:hover{background:#6BA0FF;}
  .btn-primary:disabled{opacity:.4;cursor:default;}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--bg-hover);color:var(--text-primary);}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn-console{background:var(--bg-panel-raised);color:var(--text-primary);border:1px solid var(--border);}
  .btn-console:hover{border-color:var(--accent);}
  .btn-submit{background:var(--easy);color:#0B1710;}
  .btn-submit:hover{background:#3FCB85;}
  .btn-submit:disabled{opacity:.4;cursor:default;background:var(--bg-panel-raised);color:var(--text-faint);}

  .review-link{font-size:12.5px;color:var(--accent);font-weight:600;}

  .workspace{display:flex;flex:1;min-height:0;}
  .left-pane{width:44%;min-width:340px;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--bg-panel);}
  .right-pane{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg-app);}

  .tabstrip{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--bg-panel-raised);flex-shrink:0;overflow-x:auto;}
  .tabstrip a{padding:11px 13px;font-size:12.5px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;}
  .tabstrip a:hover{color:var(--text-primary);}
  .tabstrip a.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-dot{width:5px;height:5px;border-radius:50%;background:var(--easy);}

  .pane-scroll{flex:1;overflow-y:auto;padding:22px 24px;min-height:0;}

  .diff-line{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .block-title{font-size:16px;font-weight:700;margin:0 0 14px;}
  .subhead{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin:20px 0 8px;font-weight:600;}
  .subhead:first-child{margin-top:0;}
  .body-text{color:var(--text-secondary);font-size:13.5px;line-height:1.7;margin:0 0 10px;}
  .brief-block{background:var(--bg-panel-raised);border:1px solid var(--border);border-left:3px solid var(--accent);padding:15px 17px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:var(--text-primary);font-size:14px;line-height:1.7;}
  .sender-line{font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-bottom:8px;}

  /* concept cards — the "what you'll practice / grasp" callout */
  .concept-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;}
  .concept-card{border:1px solid var(--border);background:var(--bg-panel-raised);border-radius:var(--radius-sm);padding:11px 13px;}
  .concept-card .cname{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .concept-card .cname::before{content:"◆";font-size:9px;}
  .concept-card .cblurb{font-size:12px;color:var(--text-secondary);line-height:1.5;}

  .resource-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;margin-bottom:9px;background:var(--bg-panel-raised);}
  .resource-item:last-child{margin-bottom:0;}
  .resource-item-head{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px;margin-bottom:4px;font-family:var(--mono);}
  .kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:4px;}
  .kv-item{font-size:12.5px;}
  .kv-item b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:2px;font-weight:600;}

  .table-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
  select.table-select{padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;background:var(--bg-panel-raised);color:var(--text-primary);}
  .data-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);max-height:360px;}
  table.data-table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px;}
  table.data-table th{position:sticky;top:0;background:var(--bg-panel-raised);text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text-secondary);font-weight:600;white-space:nowrap;}
  table.data-table td{padding:6px 10px;border-bottom:1px solid var(--border-soft);white-space:nowrap;color:var(--text-primary);}
  table.data-table tr:hover td{background:var(--bg-hover);}
  .row-count{font-size:11px;color:var(--text-faint);margin-top:6px;font-family:var(--mono);}

  .journal-field{margin-bottom:16px;}
  .journal-field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--text-primary);}
  .journal-field .hint{font-size:11.5px;color:var(--text-faint);margin-bottom:7px;}
  textarea.journal-box{width:100%;min-height:80px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;line-height:1.6;resize:vertical;background:var(--bg-panel-raised);color:var(--text-primary);}
  textarea.journal-box:focus{outline:none;border-color:var(--accent);}
  textarea.journal-box:disabled{opacity:.6;}
  .autosave-note{font-size:11px;color:var(--text-faint);font-family:var(--mono);}

  .editor-toolbar{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:1px solid var(--border);background:var(--bg-panel);flex-shrink:0;}
  .editor-toolbar-title{font-size:12.5px;font-weight:600;color:var(--text-secondary);font-family:var(--mono);}
  .editor-toolbar-actions{display:flex;gap:8px;}

  .submit-scroll{flex:1;overflow-y:auto;padding:20px 22px;min-height:0;}
  .evidence-row{display:grid;grid-template-columns:1fr 1fr 34px;gap:8px;margin-bottom:8px;align-items:center;}
  .evidence-row input{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;background:var(--bg-panel-raised);color:var(--text-primary);}
  .icon-btn{width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-panel-raised);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-size:15px;}
  .icon-btn:hover{background:var(--hard-soft);color:var(--hard);border-color:var(--hard-soft);}

  /* code editor (coding problems) */
  textarea.code-editor{width:100%;height:100%;min-height:320px;background:#0A0C10;color:#D3E4FF;font-family:var(--mono);font-size:13px;line-height:1.6;border:none;padding:16px 18px;resize:none;}
  textarea.code-editor:focus{outline:none;}
  .examples-block{background:var(--bg-panel-raised);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;font-family:var(--mono);font-size:11.5px;}
  .examples-block .ex-line{margin-bottom:4px;color:var(--text-secondary);word-break:break-all;}
  .examples-block .ex-line b{color:var(--text-primary);}
  .constraints-list{margin:0 0 4px;padding-left:18px;font-family:var(--mono);font-size:12px;color:var(--text-secondary);}
  .constraints-list li{margin-bottom:4px;}

  .console{height:280px;border-top:1px solid var(--border);background:var(--bg-console);display:flex;flex-direction:column;flex-shrink:0;}
  .console-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .console-tabs button{background:none;border:none;padding:9px 12px;font-size:11.5px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;}
  .console-tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
  .console-body{flex:1;overflow-y:auto;padding:12px 16px;min-height:0;}
  textarea.sql-box{width:100%;min-height:64px;font-family:var(--mono);font-size:12.5px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);resize:vertical;background:#0A0C10;color:#B9D4FF;}
  .sql-examples{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .sql-chip{font-family:var(--mono);font-size:10.5px;background:var(--bg-panel-raised);border:1px solid var(--border);padding:4px 8px;border-radius:100px;color:var(--text-secondary);}
  .sql-chip:hover{border-color:var(--accent);color:var(--accent);}
  .sql-error{background:var(--hard-soft);color:var(--hard);font-size:12px;padding:8px 12px;border-radius:var(--radius-sm);margin-top:8px;font-family:var(--mono);}
  .console-hint{font-size:11.5px;color:var(--text-faint);margin-bottom:8px;}
  .activity-row{font-family:var(--mono);font-size:11px;color:var(--text-secondary);padding:4px 0;border-bottom:1px solid var(--border-soft);display:flex;gap:10px;}
  .activity-row .k{color:var(--accent);}
  .activity-row .t{color:var(--text-faint);flex-shrink:0;}

  .test-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;font-family:var(--mono);font-size:12px;background:var(--bg-panel-raised);}
  .test-row .icon{width:16px;flex-shrink:0;}
  .test-row.pass .icon{color:var(--easy);}
  .test-row.fail .icon{color:var(--hard);}
  .test-row .name{flex:1;color:var(--text-primary);}
  .test-row .badge-hidden{font-size:9.5px;color:var(--text-faint);border:1px solid var(--border);padding:1px 6px;border-radius:100px;}
  .test-detail{font-size:11px;color:var(--text-secondary);margin:4px 0 0 26px;word-break:break-all;}
  .test-summary{font-size:12.5px;font-weight:600;margin-bottom:10px;}
  .test-summary.pass{color:var(--easy);}
  .test-summary.fail{color:var(--hard);}

  .chat-shell{display:flex;flex-direction:column;height:100%;}
  .chat-head{padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;}
  .chat-head .name{font-weight:600;font-size:13.5px;}
  .chat-head .role{font-size:11.5px;color:var(--text-faint);}
  .chat-messages{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:13px;}
  .msg{max-width:94%;}
  .msg .who{font-family:var(--mono);font-size:10px;color:var(--text-faint);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;}
  .msg .bubble{font-size:13px;line-height:1.55;padding:9px 12px;border-radius:9px;white-space:pre-wrap;}
  .msg.mgr .bubble{background:var(--bg-panel-raised);border:1px solid var(--border);border-top-left-radius:2px;color:var(--text-primary);}
  .msg.user{align-self:flex-end;}
  .msg.user .bubble{background:var(--accent);color:#0B0E12;border-top-right-radius:2px;}
  .msg.user .who{text-align:right;}
  .chat-input-row{border-top:1px solid var(--border);padding:11px 13px;display:flex;gap:8px;flex-shrink:0;}
  .chat-input-row textarea{flex:1;border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:12.5px;resize:none;min-height:36px;max-height:100px;background:var(--bg-panel-raised);color:var(--text-primary);}
  .chat-input-row textarea:focus{outline:none;border-color:var(--accent);}
  .typing{font-size:11.5px;color:var(--text-faint);font-style:italic;padding:0 18px 8px;flex-shrink:0;}

  .footer-status{background:var(--bg-panel);color:var(--text-faint);padding:7px 16px;font-size:11px;font-family:var(--mono);display:flex;justify-content:space-between;border-top:1px solid var(--border);flex-shrink:0;}

  .exec-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:26px 28px;margin-bottom:18px;}
  .score-total{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .score-total .num{font-family:var(--mono);font-size:36px;font-weight:700;color:var(--accent);}
  .score-total .of{color:var(--text-faint);font-size:14px;}
  .verdict-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:16px;}
  .exec-text{font-size:14.5px;line-height:1.75;color:var(--text-secondary);}
  .criterion{border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;background:var(--bg-panel);}
  .criterion-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .criterion-head .label{font-weight:600;font-size:13.5px;}
  .criterion-score{font-family:var(--mono);font-size:12.5px;color:var(--text-secondary);}
  .score-bar-track{height:5px;background:var(--border);border-radius:100px;overflow:hidden;margin-bottom:14px;}
  .score-bar-fill{height:100%;background:var(--accent);border-radius:100px;}
  .criterion-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .cg-block b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-bottom:4px;}
  .cg-block p{font-size:12.5px;color:var(--text-secondary);margin:0;line-height:1.55;}
  .confidence-tag{font-size:10.5px;font-family:var(--mono);color:var(--text-faint);}

  .portfolio-card{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:30px;}
  .sim-badge{display:inline-flex;align-items:center;gap:6px;background:var(--medium-soft);color:var(--medium);font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:4px 10px;border-radius:100px;margin-bottom:16px;text-transform:uppercase;}

  .empty{text-align:center;padding:60px 20px;color:var(--text-faint);}
  .loading-inline{display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:12.5px;font-family:var(--mono);}

  .banner{padding:10px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start;}
  .banner-error{background:var(--hard-soft);color:var(--hard);}
  .banner-info{background:var(--accent-soft);color:var(--accent);}

  @media (max-width:980px){

    .concept-grid{grid-template-columns:1fr;}

function levelToDifficulty(level){
  if(!level) return "Medium";
  const l = level.toLowerCase();
  if(l.includes("senior")) return "Hard";
  if(l.includes("mid")) return "Medium";
  if(l.includes("junior")) return "Easy";
  return "Medium";
}

/* Normalize the two content shapes (case_study vs coding) into one problem object */
function normalize(raw){
  if(raw.type === "case_study"){
    const sim = raw.sim;
    return {
      type: "case_study",
      slug: sim.slug, title: sim.title, role: sim.role, level: sim.level,
      difficulty: levelToDifficulty(sim.level),
      estimatedMinutes: sim.estimatedMinutes, concepts: sim.concepts || [],
      primaryCompetencies: sim.primaryCompetencies,
      company: raw.company, persona: raw.persona,
      assignmentBrief: sim.assignmentBrief, requiredOutput: sim.requiredOutput,
      datasets: sim.datasets, rubric: raw.rubric, truthModel: raw.truthModel,
    };
  }
  const p = raw.problem;
  return {
    type: "coding",
    slug: p.slug, title: p.title, role: p.role, level: p.level,
    difficulty: levelToDifficulty(p.level),
    estimatedMinutes: p.estimatedMinutes, concepts: p.concepts || [],
    primaryCompetencies: p.primaryCompetencies,
    company: raw.company, persona: raw.persona,
    assignmentBrief: p.assignmentBrief, functionName: p.functionName,
    functionSignature: p.functionSignature, starterCode: p.starterCode,
    constraints: p.constraints || [], examples: p.examples || [],
    testCases: raw.testCases || [],
  };
}
const PROBLEMS = RAW_PROBLEMS.map(normalize);
function getProblem(slug){ return PROBLEMS.find(p=>p.slug===slug); }

/* ---------------- API helper ---------------- */
async function callClaude(system, messages, {maxTokens=1000}={}){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: MODEL, max_tokens: maxTokens, system, messages })
  });
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    throw new Error("API error " + res.status + " " + t.slice(0,200));
  }
  const data = await res.json();
  return (data.content||[]).map(b=>b.text||"").join("\n").trim();
}
function parseJsonLoose(text){
  const cleaned = text.replace(/^```json/i,"").replace(/^```/,"").replace(/```$/,"").trim();
  return JSON.parse(cleaned);
}

/* ---------------- Storage / run state (per problem) ---------------- */
const RUN_KEY = slug => "run:" + slug;
const DEFAULT_RUN = (problem) => ({
  status: "assigned",
  startedAt: null, submittedAt: null,
  chat: [],
  journal: { hypotheses: "", assumptions: "", decisions: "" },
  submission: { executive_summary:"", evidence_table:[{claim:"",evidence:""}], caveats:"", recommendation:"", next_steps:"" },
  code: problem.type==="coding" ? problem.starterCode : null,
  testResults: null, // {passed, total, results:[{name,pass,hidden,error}]}
  evaluation: null,
  portfolio: null,
  events: []
});

let RUNS = {};       // slug -> run object
let CURRENT_SLUG = null;
let PROBLEM = null;  // currently active, normalized
let RUN = null;      // currently active run object
let activeLeftTab = "description";
let activeConsoleTab = "primary";

async function loadRun(slug){
  const problem = getProblem(slug);
  let run = DEFAULT_RUN(problem);
  try{
    const r = await window.storage.get(RUN_KEY(slug));
    if(r && r.value) run = JSON.parse(r.value);
  }catch(e){}
  RUNS[slug] = run;
  return run;
}
async function loadAllRuns(){
  await Promise.all(PROBLEMS.map(p => loadRun(p.slug)));
}
let saveTimer = null;
function saveRun(){
  RUNS[CURRENT_SLUG] = RUN;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(RUN_KEY(CURRENT_SLUG), JSON.stringify(RUN)); }catch(e){ console.warn("save failed", e); }
  }, 250);
}

function logEvent(type, detail){
  const entry = { type, detail: detail||"", ts: new Date().toISOString() };
  RUN.events.push(entry);
  if(RUN.events.length>200) RUN.events = RUN.events.slice(-200);
  saveRun();
  renderLedger(entry);
}
function renderLedger(entry){
  const track = document.getElementById("ledgerTrack");
  if(!track) return;
  const el = document.createElement("span");
  el.className = "ledger-item";
  const time = new Date(entry.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  el.innerHTML = `<span class="t">${time}</span><span class="k">${entry.type}</span>${entry.detail?('<span>'+entry.detail+'</span>'):''}`;
  track.appendChild(el);
  track.scrollLeft = track.scrollWidth;
  while(track.children.length > 40) track.removeChild(track.firstChild);
}
function ensureInProgress(){
  if(RUN.status === "assigned"){
    RUN.status = "in_progress";
    RUN.startedAt = new Date().toISOString();
    logEvent("run_started");
  }
}

/* ---------------- Router ---------------- */
function route(){
  const hash = location.hash.replace("#/","") || "dashboard";
  const parts = hash.split("/");
  if(parts[0]==="dashboard" || hash==="") return renderDashboard();
  if(parts[0]==="workspace") return enterProblem(parts[1]).then(()=>renderWorkspace(parts[2]||"description"));
  if(parts[0]==="review") return enterProblem(parts[1]).then(()=>renderReview());
  if(parts[0]==="portfolio") return enterProblem(parts[1]).then(()=>renderPortfolio());
  renderDashboard();
}
window.addEventListener("hashchange", route);
function nav(path){ location.hash = "#/" + path; }
async function enterProblem(slug){
  CURRENT_SLUG = slug;
  PROBLEM = getProblem(slug);
  RUN = RUNS[slug] || await loadRun(slug);
  activeConsoleTab = "primary";
}

function statusLabel(s){

function updateCode(val){ RUN.code = val; saveRun(); }

function cloneEvents(events){ return JSON.parse(JSON.stringify(events)); }
function keepIdsFromResult(result){
  if(!Array.isArray(result)) return null;
  return result.map(e => e && typeof e==="object" ? e.session_id : e).filter(v=>v!==undefined);
}
function sameIdSet(a,b){
  if(!a) return false;
  const sa = [...a].sort((x,y)=>x-y), sb=[...b].sort((x,y)=>x-y);
  if(sa.length!==sb.length) return false;
  return sa.every((v,i)=>v===sb[i]);
}

function compileUserFn(){
  const code = RUN.code || PROBLEM.starterCode;
  const fn = new Function(code + `;\nif(typeof ${PROBLEM.functionName} !== "function") throw new Error("${PROBLEM.functionName} is not defined");\nreturn ${PROBLEM.functionName};`);
  return fn();
}

function runTests(isSubmit){
  const resultWrap = document.getElementById("testResultWrap");
  let userFn;
  try{ userFn = compileUserFn(); }
  catch(e){
    if(resultWrap) resultWrap.innerHTML = `<div class="sql-error">Couldn't load your code: ${escapeHtml(e.message)}</div>`;
    logEvent("query_executed", "compile error");
    return null;
  }
  const cases = isSubmit ? PROBLEM.testCases : PROBLEM.testCases.filter(c=>!c.hidden);
  const results = cases.map(tc => {
    try{
      const out = userFn(cloneEvents(tc.input));
      const ids = keepIdsFromResult(out);
      const pass = sameIdSet(ids, tc.keepIds);
      return { name: tc.name, hidden: !!tc.hidden, pass, got: ids, expected: tc.keepIds };
    }catch(e){
      return { name: tc.name, hidden: !!tc.hidden, pass:false, error: e.message };
    }
  });
  const passed = results.filter(r=>r.pass).length;
  setConsoleTab("primary");
  renderTestResults(results, passed, cases.length, isSubmit);
  logEvent(isSubmit ? "run_submitted_tests" : "query_executed", `${passed}/${cases.length} tests`);
  return { passed, total: cases.length, results };
}
function renderTestResults(results, passed, total, isSubmit){
  const body = document.getElementById("consoleBody");
  if(!body) return;
  const allPass = passed===total;
  body.innerHTML = `
    <div class="test-summary ${allPass?'pass':'fail'}">${passed} / ${total} ${isSubmit?'submission':'visible'} tests passed</div>
    ${results.map(r=>`
      <div class="test-row ${r.pass?'pass':'fail'}">
        <span class="icon">${r.pass?'✓':'✗'}</span>
        <span class="name">${r.name}</span>
        ${r.hidden?'<span class="badge-hidden">hidden</span>':''}
      </div>
      ${!r.pass ? `<div class="test-detail">${r.error ? 'Error: '+escapeHtml(r.error) : `expected keep-ids [${(r.expected||[]).join(", ")}], got [${(r.got||[]).join(", ")}]`}</div>` : ''}
    `).join("")}
  `;
}

function openSubmitModalCoding(){
  const modal = document.createElement("div");
  modal.className = "modal-backdrop";
  modal.innerHTML = `
    <div class="modal">
      <h3>Submit for grading?</h3>
      <p>This runs your code against the full test suite (including hidden cases) and freezes the run. ${PROBLEM.persona.name.split(" ")[0]} will also get a short review of your approach.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()">Keep editing</button>
        <button class="btn btn-submit" onclick="confirmSubmitCoding()">Run full suite & submit</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}
async function confirmSubmitCoding(){
  document.querySelector(".modal-backdrop")?.remove();
  const result = runTests(true);
  if(!result) return;
  RUN.testResults = result;
  RUN.status = "submitted"; RUN.submittedAt = new Date().toISOString();
  logEvent("run_submitted");
  saveRun();
  nav("review/"+CURRENT_SLUG);
}

/* ---- Console (bottom-docked) ---- */
function setConsoleTab(tab){ activeConsoleTab = tab; renderConsole(); }
function focusConsole(){
  setConsoleTab("primary");
  document.querySelector(".console")?.scrollIntoView({block:"nearest"});
  document.getElementById("sqlBox")?.focus();
}
function renderConsole(){
  const body = document.getElementById("consoleBody");
  if(!body) return;
  document.querySelectorAll(".console-tabs button").forEach(b=>b.classList.remove("active"));
  const idx = activeConsoleTab==="primary" ? 0 : 1;
  document.querySelectorAll(".console-tabs button")[idx]?.classList.add("active");

  if(activeConsoleTab==="activity"){
    const rows = RUN.events.slice().reverse().slice(0,60);
    body.innerHTML = rows.length ? rows.map(e=>`
      <div class="activity-row"><span class="t">${new Date(e.ts).toLocaleTimeString()}</span><span class="k">${e.type}</span><span>${e.detail||""}</span></div>
    `).join("") : `<div class="console-hint">No activity logged yet.</div>`;
    return;
  }
  if(PROBLEM.type==="coding"){
    body.innerHTML = `<div class="console-hint">Click Run to test your code against the visible cases below. Submit runs the full suite, including hidden edge cases.</div><div id="testResultWrap"></div>`;
    return;
  }
  body.innerHTML = `
    <div class="console-hint">Read-only queries against ${PROBLEM.datasets.map(d=>d.table).join(", ")}.</div>
    <div class="sql-examples">
      <span class="sql-chip" onclick="setSql(this.textContent)">SELECT COUNT(*) FROM ${PROBLEM.datasets[0].table}</span>
      <span class="sql-chip" onclick="setSql(this.textContent)">SELECT device, COUNT(*) c FROM sessions GROUP BY device</span>
      <span class="sql-chip" onclick="setSql(this.textContent)">SELECT week, SUM(minutes_watched) mins FROM sessions GROUP BY week ORDER BY week</span>
    </div>
    <textarea class="sql-box" id="sqlBox" placeholder="SELECT ...">SELECT week, COUNT(*) sessions, SUM(minutes_watched) total_minutes FROM sessions GROUP BY week ORDER BY week</textarea>
    <div style="margin-top:9px;"><button class="btn btn-console btn-sm" onclick="runSql()">▷ Run</button></div>
    <div id="sqlResultWrap"></div>
  `;
}
function setSql(text){ document.getElementById("sqlBox").value = text; }
function runSql(){
  const q = document.getElementById("sqlBox").value.trim();
  const resultWrap = document.getElementById("sqlResultWrap");
  if(!/^\s*select/i.test(q)){ resultWrap.innerHTML = `<div class="sql-error">Only SELECT queries are allowed in this sandbox.</div>`; return; }
  try{
    const res = alasql(q);
    const cols = res.length ? Object.keys(res[0]) : [];
    resultWrap.innerHTML = `<div class="data-table-wrap" style="margin-top:10px;max-height:180px;"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
      <tbody>${res.slice(0,200).map(r=>`<tr>${cols.map(c=>`<td>${r[c]===null||r[c]===undefined?'':r[c]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="row-count">${res.length} result row(s)</div>`;
    logEvent("query_executed", q.slice(0,60));
  }catch(e){ resultWrap.innerHTML = `<div class="sql-error">${e.message}</div>`; }
}

/* ---- Review / evaluation ---- */
async function renderReview(){
  const app = document.getElementById("app");
  if(RUN.status==="assigned" || RUN.status==="in_progress"){
    app.innerHTML = `<div class="page"><div class="empty">No submission yet. <a class="review-link" href="#/workspace/${PROBLEM.slug}/description">Go solve the problem →</a></div></div>`;
    return;
  }
  if((RUN.status==="submitted" || RUN.status==="evaluating") && !RUN.evaluation){
    RUN.status = "evaluating"; saveRun();
    app.innerHTML = `<div class="page"><div class="page-header"><div class="eyebrow">Evaluation</div><h1 class="page-title">Grading your submission…</h1></div>
      <div class="exec-card"><div class="loading-inline"><span class="spinner"></span> ${PROBLEM.type==='coding' ? 'Running the full test suite, then getting a review of your approach.' : 'Running the rubric-based evaluator, then drafting your review.'}</div></div></div>`;
    try{ PROBLEM.type==="coding" ? await runCodingEvaluation() : await runEvaluation(); }
    catch(e){
      app.innerHTML = `<div class="page"><div class="banner banner-error">Evaluation failed: ${e.message}. <button class="btn btn-ghost btn-sm" onclick="renderReview()">Retry</button></div></div>`;
      return;
    }
    return renderReview();
  }
  const ev = RUN.evaluation;
  const rubric = PROBLEM.type==="coding" ? codingRubricShape() : PROBLEM.rubric;
  const total = ev.criteria.reduce((a,c)=>a+c.score,0);
  const max = rubric.reduce((a,c)=>a+c.maxScore,0);
  const pct = total/max;
  const verdict = pct>=0.75 ? {label:"Strong submission", cls:"diff-easy"} : pct>=0.5 ? {label:"Solid, with gaps", cls:"diff-medium"} : {label:"Needs another pass", cls:"diff-hard"};
  app.innerHTML = `
  <div class="page">
    <div class="page-header">
      <div class="eyebrow">Evaluation · ${PROBLEM.title}</div>
      <h1 class="page-title">Your result</h1>
    </div>
    <div class="exec-card">
      <div class="score-total"><span class="num">${total}</span><span class="of">/ ${max}</span></div>
      <span class="verdict-badge ${verdict.cls}">${verdict.label}</span>
      <div class="exec-text">${ev.executiveReview}</div>
    </div>
    ${ev.criteria.map(c=>renderCriterion(c, rubric)).join("")}
    <div style="display:flex;gap:10px;margin-top:22px;">
      ${RUN.status==="published" ? `<button class="btn btn-primary" onclick="nav('portfolio/${PROBLEM.slug}')">View portfolio report →</button>` : `<button class="btn btn-primary" onclick="publishPortfolio()">Publish portfolio report →</button>`}
      <button class="btn btn-ghost" onclick="nav('dashboard')">Back to problems</button>
      <button class="btn btn-ghost" onclick="resetRun()">Reset & retry</button>
    </div>
  </div>`;
}
function codingRubricShape(){
  return [
    {id:"correctness", label:"Correctness", maxScore:4},
    {id:"complexity", label:"Efficiency", maxScore:2},
    {id:"clarity", label:"Code clarity", maxScore:2},
  ];
}
function renderCriterion(c, rubric){
  const rub = rubric.find(r=>r.id===c.id) || {label:c.id, maxScore:4};
  const pct = Math.round((c.score/rub.maxScore)*100);
  return `
  <div class="criterion">
    <div class="criterion-head">
      <span class="label">${rub.label}</span>
      <span class="criterion-score">${c.score} / ${rub.maxScore} <span class="confidence-tag">· ${c.confidence} confidence</span></span>
    </div>
    <div class="score-bar-track"><div class="score-bar-fill" style="width:${pct}%"></div></div>
    <div class="criterion-grid">
      <div class="cg-block"><b>Evidence</b><p>${escapeHtml(c.evidence||"")}</p></div>
      <div class="cg-block"><b>Strength</b><p>${escapeHtml(c.strength||"")}</p></div>
      <div class="cg-block"><b>Improvement</b><p>${escapeHtml(c.improvement||"")}</p></div>
      <div class="cg-block"><b>Next practice</b><p>${escapeHtml(c.nextPractice||"")}</p></div>
    </div>
  </div>`;
}

async function runEvaluation(){
  const submissionText = `EXECUTIVE SUMMARY: ${RUN.submission.executive_summary}
EVIDENCE TABLE: ${RUN.submission.evidence_table.map(r=>`- ${r.claim} => ${r.evidence}`).join("\n")}
CAVEATS: ${RUN.submission.caveats}
RECOMMENDATION: ${RUN.submission.recommendation}
NEXT STEPS: ${RUN.submission.next_steps}

WORK JOURNAL (private reasoning trail):
Hypotheses: ${RUN.journal.hypotheses}
Assumptions: ${RUN.journal.assumptions}
Decisions: ${RUN.journal.decisions}

SQL / DATA EVENTS DURING RUN: ${RUN.events.filter(e=>e.type==="query_executed").map(e=>e.detail).join(" | ") || "none logged"}`;

  const evalRaw = await callClaude(evaluatorSystemPrompt(PROBLEM), [{role:"user", content: submissionText}], {maxTokens:1000});
  let parsed;
  try{ parsed = parseJsonLoose(evalRaw); }
  catch(e){ throw new Error("evaluator returned unparseable output"); }

  const editorInput = `Rubric: ${JSON.stringify(PROBLEM.rubric.map(r=>({id:r.id,label:r.label})))}
Criterion results: ${JSON.stringify(parsed.criteria)}`;
  const executiveReview = await callClaude(feedbackEditorSystemPrompt(), [{role:"user", content: editorInput}], {maxTokens:500});

  RUN.evaluation = { criteria: parsed.criteria, executiveReview };
  RUN.status = "reviewed";
  logEvent("evaluation_completed");
  saveRun();
}

async function runCodingEvaluation(){
  const tr = RUN.testResults || runTests(true);
  RUN.testResults = tr;
  const passFraction = tr.total ? Math.round((tr.passed/tr.total)*100) : 0;
  const correctnessScore = tr.total ? Math.round((tr.passed/tr.total)*4) : 0;

  const system = codeReviewSystemPrompt(PROBLEM).replace("{{PASS_FRACTION}}", passFraction + "%");
  const codeMsg = `USER'S CODE:\n${RUN.code}\n\nTEST RESULT GIVEN TO YOU: ${tr.passed}/${tr.total} passed (${passFraction}%). Do not re-judge correctness.`;
  const raw = await callClaude(system, [{role:"user", content: codeMsg}], {maxTokens:500});
  let parsed;
  try{ parsed = parseJsonLoose(raw); }
  catch(e){ parsed = { complexity:{score:1,note:"unavailable"}, clarity:{score:1,note:"unavailable"}, review: raw.slice(0,400) }; }

  const criteria = [
    { id:"correctness", score: correctnessScore, confidence:"high", evidence: `${tr.passed}/${tr.total} test cases passed`, strength: tr.passed>0 ? "Handles at least the base cases correctly." : "—", improvement: tr.passed<tr.total ? `${tr.total-tr.passed} case(s) still failing — check the Console tab for which ones.` : "All cases pass.", nextPractice: "Re-run edge cases by hand before submitting next time." },
    { id:"complexity", score: parsed.complexity.score, confidence:"medium", evidence: parsed.complexity.note, strength: parsed.complexity.note, improvement: parsed.complexity.score<2 ? "Consider the time complexity of your approach relative to a single hash-based pass." : "—", nextPractice: "Practice stating Big-O before you code, not after." },
    { id:"clarity", score: parsed.clarity.score, confidence:"medium", evidence: parsed.clarity.note, strength: parsed.clarity.note, improvement: parsed.clarity.score<2 ? "Naming and structure could better signal intent." : "—", nextPractice: "Read your function back as if reviewing someone else's PR." },
  ];
  RUN.evaluation = { criteria, executiveReview: parsed.review };
  RUN.status = "reviewed";
  logEvent("evaluation_completed");
  saveRun();
}

async function publishPortfolio(){
  const scoreLine = PROBLEM.type==="coding"
    ? `Test suite result: ${RUN.testResults.passed}/${RUN.testResults.total} passed.`
    : `Executive summary submitted by the user: ${RUN.submission.executive_summary}\nRecommendation submitted: ${RUN.submission.recommendation}`;
  const rubric = PROBLEM.type==="coding" ? codingRubricShape() : PROBLEM.rubric;
  const input = `Role: ${PROBLEM.role}
Company (fictional): ${PROBLEM.company.name}
Business problem: ${PROBLEM.assignmentBrief}
Competencies demonstrated: ${PROBLEM.primaryCompetencies.join(", ")}
${scoreLine}
Overall score: ${RUN.evaluation.criteria.reduce((a,c)=>a+c.score,0)} / ${rubric.reduce((a,c)=>a+c.maxScore,0)}`;
  try{
    const text = await callClaude(portfolioSummarizerSystemPrompt(), [{role:"user", content: input}], {maxTokens:400});
    RUN.portfolio = text;
    RUN.status = "published";
    logEvent("portfolio_published");
    saveRun();
    nav("portfolio/"+PROBLEM.slug);
  }catch(e){ alert("Couldn't generate the portfolio report: " + e.message); }
}

function renderPortfolio(){
  const app = document.getElementById("app");
  if(!RUN.portfolio){
    app.innerHTML = `<div class="page"><div class="empty">No portfolio report yet. <a class="review-link" href="#/review/${PROBLEM.slug}">Go publish one →</a></div></div>`;
    return;
  }
  app.innerHTML = `
  <div class="page" style="max-width:720px;">
    <div class="page-header"><div class="eyebrow">Portfolio report</div><h1 class="page-title">${PROBLEM.title}</h1></div>
    <div class="portfolio-card">
      <div class="sim-badge">Simulation · not employment</div>
      <div class="exec-text" style="font-size:14.5px;">${RUN.portfolio}</div>
    </div>
    <div style="margin-top:18px;"><button class="btn btn-ghost" onclick="nav('review/${PROBLEM.slug}')">← Back to evaluation</button></div>
  </div>`;
  logEvent("public_report_viewed");
}

/* ---------------- Boot ---------------- */
(async function boot(){
  await loadAllRuns();
  route();
})();
</script>
